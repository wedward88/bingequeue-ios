name: BingeQueue
options:
  bundleIdPrefix: com.bingequeue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  BingeQueue:
    type: application
    platform: iOS
    sources:
      - path: BingeQueue
        excludes:
          - Resources/**
          - Assets.xcassets
      - path: Shared
      - path: BingeQueue/Assets.xcassets
        buildPhase: resources
      - path: BingeQueue/Resources/tmdb-logo.svg
        buildPhase: resources
    settings:
      base:
        # Must match Google Cloud iOS OAuth client bundle ID
        PRODUCT_BUNDLE_IDENTIFIER: com.bingequeue.com
        INFOPLIST_FILE: BingeQueue/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: BingeQueue/Resources/BingeQueue.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: "2866ZNMW73"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: BingeQueueWidget
        embed: true

  BingeQueueWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BingeQueueWidget
        excludes:
          - Info.plist
          - "*.entitlements"
          - Assets.xcassets
      - path: Shared
      - path: BingeQueueWidget/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bingequeue.com.widget
        INFOPLIST_FILE: BingeQueueWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: BingeQueueWidget/BingeQueueWidget.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: "2866ZNMW73"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    info:
      path: BingeQueueWidget/Info.plist
      properties:
        CFBundleDisplayName: BingeQueue
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
